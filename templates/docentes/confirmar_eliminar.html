{% extends "base.html" %}
{% block contenido %}
<h2>Eliminar docente</h2>
<p>¿Seguro que desea eliminar a <strong>{{ docente }}</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Sí, eliminar</button>
  <a href="{% url 'lista_docentes' %}">Cancelar</a>
</form>
{% endblock %}
